[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forecastguard"
version = "0.1.0"
description = "AI-based forecast reliability intelligence system for medium-range numerical weather prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ForecastGuard Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "eccodes>=1.6.0",
    "cdsapi>=0.7.7",
    "numpy>=1.24.0",
    "xarray>=2024.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
forecastguard-case = "scientific.cases.cli:main"
forecastguard-tigge = "scientific.ingestion.tigge:main"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "backend"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    "node_modules",
]
